<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book your stay — Luna's Oasis</title>
<meta name="description" content="Book your staycation at Luna's Oasis, Quezon City. Pick a date, time and package, add your guests, and get your booking ticket.">
<meta name="theme-color" content="#12100E">
<link rel="icon" type="image/png" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&amp;family=Jost:wght@300;400;500;600&amp;family=Pinyon+Script&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12100E; --ink2:#1B1714; --cream:#F3ECE0; --paper:#FBF7EE; --line:#E2D6C2;
  --gold:#C9A96E; --bronze:#7A5A2E; --text:#2A231D; --muted:#6B6157; --soft:#B9AE9F;
  --busy:#D3C7B5; --part:#EAD9B5; --bad:#9A3B2E; --ok:#2F5A47;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--cream);font-family:Jost,sans-serif;font-size:16px;line-height:1.5}
a{color:var(--gold)}
button,input,select{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
.cap{font-size:12px;letter-spacing:.32em;text-transform:uppercase}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* top bar */
.top{border-bottom:1px solid rgba(201,169,110,.25)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--cream)}
.brand img{height:46px;width:auto}
.brand span{font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:.24em;text-transform:uppercase}
.back{color:var(--cream);text-decoration:none;font-size:15px}
.back:hover{color:var(--gold)}

/* hero */
.hero{position:relative;text-align:center;padding:38px 16px 34px;overflow:hidden}
.moon{position:relative;width:96px;height:96px;margin:0 auto 6px}
.moon:before,.moon:after{content:"";position:absolute;inset:0;border-radius:50%}
.moon:before{background:var(--gold);box-shadow:0 0 70px rgba(201,169,110,.35)}
.moon:after{background:var(--ink);transform:translate(24px,-14px)}
.hero .luna{font-family:'Pinyon Script',cursive;color:var(--gold);font-size:56px;line-height:1.1}
.hero h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(40px,6vw,70px);line-height:1;margin:0}
.hero p{color:var(--soft);margin:12px 0 0;font-size:17px}

/* steps */
.steps{display:flex;gap:6px;background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:7px;margin:0 0 22px}
.steps button{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;border:0;border-radius:999px;background:transparent;color:var(--text);cursor:pointer;font-size:12px;letter-spacing:.22em;text-transform:uppercase;padding:0 8px}
.steps button .n{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#E6DCCB;font-size:11px;letter-spacing:0;flex:none}
.steps button[aria-current="step"]{background:var(--ink);color:var(--gold)}
.steps button[aria-current="step"] .n{background:var(--cream);color:var(--ink)}
.steps button.done .n{background:var(--gold);color:var(--ink)}
.steps button:disabled{cursor:default;opacity:.55}
.steps .short{display:none}

/* layout */
.layout{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start;padding-bottom:70px}
.main{flex:999 1 560px;min-width:0}
.aside{flex:1 1 340px;min-width:0}
.card{background:var(--cream);color:var(--text);border:1px solid var(--line);border-radius:26px;padding:30px 32px}
.card h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:34px;line-height:1.1;margin:0}
.card .sub{color:var(--muted);margin:6px 0 22px;font-size:15px}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 28px;border-radius:999px;border:0;cursor:pointer;font-size:12px;letter-spacing:.24em;text-transform:uppercase;text-decoration:none}
.pill.gold{background:var(--gold);color:var(--ink)}
.pill.gold:disabled{background:#3A332C;color:#8A7E6E;cursor:not-allowed}
.pill.ghost{background:transparent;color:var(--cream);border:1px solid rgba(243,236,224,.45)}
.pill.dark{background:var(--ink);color:var(--gold)}
.pill:focus-visible,.steps button:focus-visible,.day:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.err{background:#F6E3DF;color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:14px}
.note{font-size:13px;color:var(--muted);margin-top:12px}

/* calendar */
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calnav h3{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:28px;margin:0}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--text);cursor:pointer;font-size:18px}
.round:disabled{opacity:.35;cursor:default}
.promo{display:flex;align-items:center;gap:14px;background:var(--ink2);color:var(--cream);border:1px solid var(--gold);border-radius:14px;padding:10px 16px;margin-bottom:14px}
.promo b{font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--gold);font-weight:600;white-space:nowrap}
.promo span{font-size:14px}
.promo em{color:var(--gold);font-style:normal}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dow div{text-align:center;font-size:11px;letter-spacing:.2em;color:var(--muted);padding:4px 0}
.day{min-height:62px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.day b{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;line-height:1}
.day small{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.day.empty{visibility:hidden}
.day.off{background:transparent;border-color:transparent;color:#B5AA9A;cursor:default}
.day.part{background:var(--part);border-color:var(--part)}
.day.full{background:var(--busy);border-color:var(--busy);cursor:default;color:#6F6458}
.day.sel{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.day.sel small{color:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}

/* packages / times */
.pkgs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pkg{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:18px;padding:16px 18px;cursor:pointer;color:var(--text)}
.pkg[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset}
.pkg .t{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;line-height:1}
.pkg .d{font-size:13px;color:var(--muted);margin:4px 0 10px}
.pkg .p{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600}
.pkg s{font-size:13px;color:var(--muted);margin-left:6px}
.label{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;display:block}
.chip{min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--text);cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.chip:disabled{background:transparent;color:#B9AE9F;text-decoration:line-through;cursor:default}
.stepper{display:inline-flex;align-items:center;gap:12px}
.stepper output{min-width:70px;text-align:center;font-size:16px}

/* guests */
.paxrow{display:flex;gap:8px;flex-wrap:wrap}
.paxrow .chip{min-width:58px;font-size:16px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--bronze);flex:none;margin-top:1px}
.guest{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:14px 16px;margin-top:12px}
.guest .gh{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--bronze);margin-bottom:8px}
.inp{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;color:var(--text);font-size:16px}
.inp:focus{outline:none;border-color:var(--bronze)}
.file{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.file label{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--text);cursor:pointer;font-size:13px}
.file input{position:absolute;left:-9999px}
.file .fs{font-size:13px;color:var(--muted)}
.file .fs.ok{color:var(--ok)}
.file img{width:44px;height:30px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}

/* details */
.rules{margin:10px 0 0;padding:0;list-style:none;font-size:14px}
.rules li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.rules li:before{content:"✦";color:var(--gold)}

/* summary */
.sum{background:var(--paper);color:var(--text);border-radius:26px;overflow:hidden;border:1px solid var(--line)}
.sum .head{background:var(--ink);color:var(--cream);padding:18px 22px;display:flex;align-items:center;gap:12px}
.sum .head img{height:40px}
.sum .head div div:first-child{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.sum .head div div:last-child{font-family:'Cormorant Garamond',serif;font-size:22px}
.sum .body{padding:16px 22px 20px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row span:last-child{text-align:right}
.row.total{border-bottom:0;font-size:16px;font-weight:600;padding-top:12px}
.row.total span:last-child{font-family:'Cormorant Garamond',serif;font-size:30px}
.row.disc span{color:var(--ok)}
.promo-tag{display:inline-block;background:var(--gold);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:600;letter-spacing:.08em}

/* date range + typed time */
.day.range{background:#E9DDC6;border-color:#D9C7A3}
.day.range small{color:var(--bronze)}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:16px;background:var(--ink);color:var(--cream);border-radius:14px;padding:12px 16px;font-size:14px}
.selbar b{color:var(--gold);font-weight:500}
.selbar button{margin-left:auto;background:none;border:1px solid rgba(243,236,224,.4);color:var(--cream);border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer}
.timebox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timebox input[type=time]{min-height:52px;font-size:22px;font-family:'Cormorant Garamond',serif;font-weight:600;padding:0 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--text);min-width:170px}
.timebox input[type=time]:focus{outline:none;border-color:var(--bronze)}
.timebox input.bad{border-color:var(--bad);background:#FBEDEA}
.tmsg{margin-top:10px;font-size:14px;line-height:1.5}
.tmsg.ok{color:var(--ok)}
.tmsg.bad{color:var(--bad)}
.usebtn{margin-left:6px;background:var(--ink);color:var(--gold);border:0;border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer}
.busy{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--muted)}
.busy b{color:var(--text);font-weight:600}
.nightcard{border:1.5px solid var(--ink);background:var(--paper);border-radius:18px;padding:16px 18px}
.nightcard .t{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;line-height:1}
.nightcard .d{font-size:13px;color:var(--muted);margin-top:6px}

/* ticket */
.donewrap{max-width:640px;margin:0 auto 70px}
.ticket{background:var(--paper);color:var(--text);border-radius:26px;overflow:hidden;box-shadow:0 22px 50px rgba(0,0,0,.45)}
.ticket .th{background:var(--ink);padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--gold)}
.ticket .th img{height:52px}
.ticket .th .k{font-size:10px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;text-align:right}
.ticket .th .ref{font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--cream);text-align:right}
.ticket .tb{padding:20px 26px 24px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tbox{background:#F1E8DA;border-radius:14px;padding:12px 14px}
.tbox div:first-child{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.tbox div:last-child{font-weight:600;margin-top:2px}
.status{display:flex;gap:10px;background:#FFF4D6;border:1px solid #EAD9B5;border-radius:14px;padding:12px 14px;font-size:14px;margin-top:14px}
.after{margin:18px 0 0;padding:0 0 0 18px;color:var(--soft);font-size:15px}
.after li{margin:6px 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.thanks{text-align:center;margin:0 0 22px}
.thanks h2{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(32px,5vw,48px);margin:0}
.thanks p{color:var(--soft);margin:6px 0 0}

.loading{padding:60px 16px;text-align:center;color:var(--soft)}
.spin{width:28px;height:28px;border-radius:50%;border:2px solid rgba(201,169,110,.3);border-top-color:var(--gold);animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* phones */
@media (max-width: 760px){
  .wrap{padding:0 14px}
  .top .wrap{min-height:58px}
  .brand img{height:34px}
  .brand span{font-size:14px;letter-spacing:.2em}
  .back{font-size:13px}
  .hero{padding:20px 14px 18px}
  .moon{width:60px;height:60px}
  .moon:after{transform:translate(15px,-9px)}
  .hero .luna{font-size:38px}
  .hero h1{font-size:34px}
  .hero p{font-size:14px}
  .steps{border-radius:16px;padding:5px;gap:4px}
  .steps button{flex-direction:column;gap:3px;min-height:52px;font-size:10px;letter-spacing:.1em;border-radius:12px}
  .steps .long{display:none}
  .steps .short{display:inline}
  .card{border-radius:20px;padding:18px 14px}
  .card h2{font-size:26px}
  .card .sub{font-size:13.5px;margin-bottom:14px}
  .calnav h3{font-size:22px}
  .round{width:38px;height:38px}
  .promo{padding:8px 12px;gap:10px}
  .promo b{font-size:20px}
  .promo span{font-size:12px}
  .dow,.grid{gap:4px}
  .dow div{font-size:9px;letter-spacing:.08em}
  .day{min-height:46px;border-radius:10px;padding:2px}
  .day b{font-size:17px}
  .day small{display:none}
  .day.part:after,.day.full:after{content:"";width:5px;height:5px;border-radius:50%;background:var(--bronze);margin-top:2px}
  .day.full:after{background:#6F6458}
  .legend{font-size:11.5px;gap:6px 12px}
  .pkgs{gap:8px}
  .pkg{padding:12px}
  .pkg .t{font-size:21px}
  .pkg .d{font-size:11.5px}
  .pkg .p{font-size:24px}
  .timebox input[type=time]{font-size:20px;min-width:150px}
  .selbar{font-size:13px}
  .chip{min-height:38px;font-size:12.5px;border-radius:10px}
  .navrow .pill{min-height:46px;padding:0 20px;font-size:11px}
  .tgrid{gap:8px}
  .ticket .th{padding:16px 18px}
  .ticket .th img{height:40px}
  .ticket .th .ref{font-size:24px}
  .ticket .tb{padding:16px 18px 20px}
  .layout{gap:14px;padding-bottom:40px}
  .aside{order:-1}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="./"><img src="assets/img/logo.png" alt=""><span>Luna's Oasis</span></a>
    <a class="back" href="./">← Back to home</a>
  </div>
</header>

<section class="hero">
  <div class="moon" aria-hidden="true"></div>
  <div class="luna">Luna's</div>
  <h1>Book your stay</h1>
  <p>Just 4 easy steps. We'll send your booking to your Gmail.</p>
</section>

<main class="wrap" id="app">
  <div class="loading"><div class="spin"></div>Loading the calendar…</div>
</main>

<script src="js/config.js"></script>
<script>
(function () {
  'use strict';
  var API = window.LUNA_CONFIG && window.LUNA_CONFIG.API_URL;
  var app = document.getElementById('app');
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var HOUR = 3600000, DAY = 86400000, PH = 8 * HOUR, MAX_NIGHTS = 7, MAX_EXTRA = 9;

  var cfg = null;            // prices and rules from the Sheet
  var blocksByMonth = {};    // 'yyyy-mm' -> [{s,e}]
  var gapMs = 2 * HOUR;
  var S = {
    step: 1, y: 0, m: 0, inDay: '', nights: 1, outPicked: false, time: '', pkg: '', tier: 0, extra: 0,
    pax: 2, baby: false, guests: [], email: '', agree: false,
    busy: false, error: '', ticket: null
  };

  // ---------- helpers ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function peso(n) { return '₱' + Math.round(n).toLocaleString('en-PH'); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function todayYmd() { return new Date(Date.now() + PH).toISOString().slice(0, 10); }
  function ms(day, hm) {      // Manila local -> epoch ms
    var p = day.split('-'), t = (hm || '00:00').split(':');
    return Date.UTC(+p[0], +p[1] - 1, +p[2], +t[0], +t[1]) - PH;
  }
  function local(msv) { var d = new Date(msv + PH); return { day: d.toISOString().slice(0, 10), hm: d.toISOString().slice(11, 16) }; }
  function addDays(day, n) { return new Date(ms(day) + PH + n * DAY).toISOString().slice(0, 10); }
  function daysBetween(a, b) { return Math.round((ms(b) - ms(a)) / DAY); }
  function hm12(hm) { var h = +hm.slice(0, 2), m = hm.slice(3); return ((h + 11) % 12 + 1) + ':' + m + ' ' + (h < 12 ? 'AM' : 'PM'); }
  function niceDay(day) { var d = new Date(ms(day) + PH); return DOW[d.getUTCDay()] + ', ' + MON[d.getUTCMonth()] + ' ' + d.getUTCDate() + ' ' + d.getUTCFullYear(); }
  function shortDay(day) { return niceDay(day).replace(/ \d{4}$/, ''); }
  function niceWhen(msv) { var l = local(msv); return niceDay(l.day) + ' · ' + hm12(l.hm); }
  function shortWhen(msv) { var l = local(msv); return shortDay(l.day) + ', ' + hm12(l.hm); }
  function rateOf(pkg) { return (cfg.rates || []).filter(function (r) { return r.package === pkg; })[0]; }
  function nightlyPkg() { var r = cfg.rates.filter(function (x) { return x.hours >= 20; })[0]; return r ? r.package : ''; }
  function promoFor(day) {
    return (cfg.promos || []).filter(function (p) { return p.start_date <= day && day <= p.end_date; })[0] || null;
  }
  function monthKey(y, m) { return y + '-' + pad(m + 1); }
  function step() { return cfg.checkin_step_minutes || 30; }

  // The stay the guest has chosen so far.
  function isNightly() { var r = rateOf(S.pkg); return !!(r && r.hours >= 20); }
  function nights() { return isNightly() ? S.nights : 0; }
  function outDay() { return S.inDay && nights() ? addDays(S.inDay, S.nights) : ''; }
  function pkgNow() { return S.pkg; }
  function stayHours() {
    var r = rateOf(pkgNow()); if (!r) return 0;
    var n = nights();
    return (n ? 24 * (n - 1) + r.hours : r.hours) + S.extra;
  }
  function stayAt(hm) { var s0 = ms(S.inDay, hm); return { s: s0, e: s0 + stayHours() * HOUR }; }

  function price() {
    var r = rateOf(pkgNow()); if (!r) return null;
    var base = S.tier === 4 ? r.rate_3_4_pax : r.rate_1_2_pax, units = Math.max(1, nights());
    var t = { base: base, units: units, nightly: nights() > 0, lines: [], stay: 0, disc: 0, promoName: '', pcts: {} };
    for (var i = 0; i < units; i++) {

  function allBlocks() {
    var all = [], seen = {};

  function clashes(s0, e0) {

  }
  function timeOk(hm) { if (!S.inDay || !hm) return false; var st = stayAt(hm); return clashes(st.s, st.e).length === 0; }
  function slots() { var out = []; for (var t = 0; t < 1440; t += step()) out.push(pad(Math.floor(t / 60)) + ':' + pad(t % 60)); return out; }

  // ---------- backend ----------
  function getJSON(params) {
    var q = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');

    var from = ymd(y, m, 1), to = ymd(y, m, new Date(Date.UTC(y, m + 1, 0)).getUTCDate());

    function stepDate() {

    app.innerHTML = '<div class="donewrap">' +
      '<div class="ticket" id="ticket"><div class="th"><img src="assets/img/logo.png" alt="Luna\'s Oasis"><div><div class="k">Booking ticket</div><div class="ref">' + esc(t.ref) + '</div></div></div>' +
      '<div class="tb"><div class="tgrid">' +
      '<div class="tbox"><div>Check-in</div><div>' + niceWhen(inMs) + '</div></div>' +
      '<div class="tbox"><div>Check-out</div><div>' + niceWhen(outMs) + '</div></div>' +
      '<div class="tbox"><div>Main guest</div><div>' + esc(t.guest_name) + '</div></div>' +
      '<div class="tbox"><div>Guests</div><div>' + t.pax + (t.baby ? ' + baby' : '') + (t.nights ? ' · ' + t.nights + (t.nights > 1 ? ' nights' : ' night') : '') + '</div></div></div>' +
      priceRows({ nightly: t.nights > 0, units: t.nights || 1, base: p.unit_rate, hoursLabel: (t.hours - p.extra_hours) + '-hour', pax: t.pax, stay: p.stay_rate, disc: p.discount, pct: p.promo_pct, promoName: p.promo_name,
        extras: p.extras_total, extraHours: p.extra_hours, deposit: p.deposit, total: p.total }) +
      '<div class="status">⏳ <span><b>Not confirmed yet.</b> Send this ticket to us on Messenger. We\'ll reply with GCash / bank details.</span></div>' +
      '</div></div>' +
      '<div class="thanks" style="margin:26px 0 0"><h2>Your ticket is ready</h2><p>We also sent it to ' + esc(t.guest_email) + '.</p></div>' +
      '<div class="actions" style="justify-content:center"><button type="button" class="pill gold" data-act="save">Save ticket</button>' +
      '<a class="pill ghost" href="' + esc(t.messenger_url || '#') + '" target="_blank" rel="noopener">Send on Messenger</a></div>' +
      '<ol class="after"><li>Save the ticket, then send it to us on Messenger.</li><li>Pay through GCash or bank transfer and send the receipt.</li><li>We confirm and send your Guest Access Form (GAF) to your Gmail.</li></ol>' +
      '<div class="actions" style="justify-content:center"><button type="button" class="pill ghost" data-act="again">Book another stay</button></div></div>';
    window.scrollTo(0, 0);
  }

  // ---------- ticket image ----------
  function ticketPng() {
    var t = S.ticket, p = t.price, W = 1080;
    var H = 1500 - (p.discount ? 0 : 62) - (p.extras_total ? 0 : 62), c = document.createElement('canvas');
    c.width = W; c.height = H;
    var g = c.getContext('2d');
    var serif = '"Cormorant Garamond", Georgia, serif', sans = 'Jost, Arial, sans-serif';
    var inMs = tMs(t.check_in), outMs = tMs(t.check_out);
    function rr(x, y, w, h, r, fill) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); g.fillStyle = fill; g.fill(); }
    g.fillStyle = '#12100E'; g.fillRect(0, 0, W, H);
    rr(60, 60, W - 120, H - 120, 40, '#FBF7EE');
    rr(60, 60, W - 120, 250, 40, '#12100E'); g.fillStyle = '#12100E'; g.fillRect(60, 200, W - 120, 110);
    g.fillStyle = '#C9A96E'; g.fillRect(60, 308, W - 120, 4);
    return new Promise(function (res) {
      var logo = new Image();
      logo.onload = logo.onerror = function () {
        if (logo.naturalWidth) { var h = 150, w = logo.naturalWidth * h / logo.naturalHeight; g.drawImage(logo, 110, 110, w, h); }
        g.textAlign = 'right'; g.fillStyle = '#C9A96E'; g.font = '500 24px ' + sans; g.fillText('B O O K I N G   T I C K E T', W - 110, 160);
        g.fillStyle = '#F3ECE0'; g.font = '500 72px ' + serif; g.fillText(t.ref, W - 110, 240);
        g.textAlign = 'left';
        var y = 360;
        function box(x, yy, label, val) {
          rr(x, yy, 400, 120, 22, '#F1E8DA');
          g.fillStyle = '#6B6157'; g.font = '500 20px ' + sans; g.fillText(label.toUpperCase(), x + 26, yy + 42);
          g.fillStyle = '#2A231D'; g.font = '600 30px ' + sans; g.fillText(val, x + 26, yy + 88);
        }
        var li = local(inMs), lo = local(outMs);
        box(110, y, 'Check-in', shortDay(li.day)); box(570, y, 'Check-out', shortDay(lo.day));
        y += 140;
        box(110, y, 'Time in', hm12(li.hm)); box(570, y, 'Time out', hm12(lo.hm));
        y += 140;
        box(110, y, 'Main guest', t.guest_name.length > 20 ? t.guest_name.slice(0, 19) + '…' : t.guest_name);
        box(570, y, 'Guests', t.pax + (t.baby ? ' + baby' : '') + ' pax' + (t.nights ? ' · ' + t.nights + (t.nights > 1 ? ' nights' : ' night') : ''));
        y += 180;
        function line(a, b, bold, color) {
          g.fillStyle = color || '#2A231D'; g.font = (bold ? '600 ' : '400 ') + (bold ? 34 : 28) + 'px ' + sans;
          g.textAlign = 'left'; g.fillText(a, 110, y); g.textAlign = 'right'; g.fillText(b, W - 110, y); g.textAlign = 'left';
          if (!bold) { g.fillStyle = '#E2D6C2'; g.fillRect(110, y + 22, W - 220, 2); }
          y += bold ? 70 : 62;
        }
        line((t.nights ? t.nights + (t.nights > 1 ? ' nights' : ' night') + ' × ' + peso(p.unit_rate) : (t.hours - p.extra_hours) + '-hour stay') + ' (' + (t.pax <= 2 ? '2' : '4') + ' pax)', peso(p.stay_rate));
        if (p.discount) line((p.promo_pct ? p.promo_pct + '% OFF · ' : 'Promo · ') + p.promo_name, '−' + peso(p.discount), false, '#2F5A47');
        if (p.extras_total) line('Extra hours (' + p.extra_hours + ')', peso(p.extras_total));
        line('Security deposit (refundable)', peso(p.deposit));
        y += 10; line('TOTAL', peso(p.total), true);
        rr(110, y, W - 220, 120, 22, '#FFF4D6');
        g.fillStyle = '#2A231D'; g.font = '600 26px ' + sans; g.fillText('Not confirmed yet', 140, y + 48);
        g.font = '400 24px ' + sans; g.fillText('Send this ticket on Messenger. GCash or bank transfer only.', 140, y + 88);
        g.textAlign = 'center'; g.fillStyle = '#7A5A2E'; g.font = 'italic 400 30px ' + serif;
        g.fillText('✦ Stay · Unwind · Belong ✦', W / 2, H - 100);
        c.toBlob(function (b) { res(b); }, 'image/png');
      };
      logo.src = 'assets/img/logo.png';
    });
  }
  function saveTicket() {
    ticketPng().then(function (blob) {
      var name = 'Lunas-Oasis-' + S.ticket.ref + '.png';
      var file = window.File ? new File([blob], name, { type: 'image/png' }) : null;
      if (file && navigator.canShare && navigator.canShare({ files: [file] }) && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
        navigator.share({ files: [file], title: 'Luna\'s Oasis booking ' + S.ticket.ref }).catch(function () {});
        return;
      }
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    });
  }

  // ---------- ID files ----------
  function readId(i, file) {
    var g = S.guests[i];
    if (!file) return;
    if (file.size > 15 * 1024 * 1024) { g.file = { error: 'That file is too big. Please choose one under 15 MB.' }; render(); return; }
    g.file = { busy: true }; render();
    var done = function (obj) { g.file = obj; render(); };
    if (file.type === 'application/pdf') {
      if (file.size > 4.5 * 1024 * 1024) return done({ error: 'PDF is too big (max 4.5 MB). Try a photo instead.' });
      var fr = new FileReader();
      fr.onload = function () { done({ data: String(fr.result).split(',')[1], mime: 'application/pdf', label: 'PDF ready' }); };
      fr.onerror = function () { done({ error: 'Could not read that file. Please try again.' }); };
      fr.readAsDataURL(file);
      return;
    }
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var max = 1600, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      var dataUrl = c.toDataURL('image/jpeg', 0.82);
      var t = document.createElement('canvas'), ts = 60 / Math.max(c.width, c.height); t.width = c.width * ts; t.height = c.height * ts;
      t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
      URL.revokeObjectURL(url);
      done({ data: dataUrl.split(',')[1], mime: 'image/jpeg', label: 'ID photo ready', thumb: t.toDataURL('image/jpeg', .7) });
    };
    img.onerror = function () { URL.revokeObjectURL(url); done({ error: 'Please upload a JPG, PNG or PDF.' }); };
    img.src = url;
  }
  function syncGuests() {
    while (S.guests.length < S.pax) S.guests.push({ name: '', file: null });
    S.guests.length = S.pax;
  }

  // ---------- events ----------
   function pickDay(day) {
    if (!S.inDay) { S.inDay = day; S.nights = 1; return; }
    var first = S.inDay, last = addDays(first, S.nights - 1);
    if (day === first && S.nights === 1) { S.inDay = ''; S.nights = 1; return; }       // un-pick the only date
    if (day === first) { S.inDay = addDays(first, 1); S.nights--; return; }             // remove first night
    if (day === last) { S.nights--; return; }                                            // remove last night
    if (day > first && day < last) { S.nights = daysBetween(first, day); return; }       // remove this date and after
    var nf = day < first ? day : first, nl = day > last ? day : last, n = daysBetween(nf, nl) + 1;
    var adjacent = day === addDays(last, 1) || day === addDays(first, -1);
    if (n > MAX_NIGHTS) {
      if (adjacent) { S.error = 'The longest stay is ' + MAX_NIGHTS + ' nights. For longer stays, please message us.'; return; }
      S.inDay = day; S.nights = 1; return;                                               // far away: start again
    }
    var keep = { inDay: S.inDay, nights: S.nights, pkg: S.pkg, extra: S.extra };
    S.inDay = nf; S.nights = n; S.extra = 0;
    if (!isNightly()) S.pkg = nightlyPkg();
    var fits = loadedFor(nf, addDays(nl, 1)) ? nextOk('00:00') : 'unknown';
    S.extra = keep.extra;
    if (!fits) {
      S.inDay = keep.inDay; S.nights = keep.nights; S.pkg = keep.pkg;
      S.error = 'Sorry, some of those nights are already booked. Please pick other dates.';
      return;
    }
    if (!adjacent) S.note = 'Your stay has to be continuous, so we also picked the dates in between.';
  }
  function loadedFor(a, b) {
    for (var d = a; d <= b; d = addDays(d, 1)) if (!blocksByMonth[d.slice(0, 7)]) return false;
    return true;
  }
  function setTime(v) {
    S.time = v || '';
    var box = document.getElementById('tmsg'), inp = document.getElementById('tin');
    if (box) box.innerHTML = timeMsg();
    if (inp) { inp.classList.toggle('bad', !!S.time && !timeOk(S.time)); if (inp.value !== S.time) inp.value = S.time; }
    refreshNav();
  }
  function shiftTime(dir) {
    var list = slots(), cur = S.time ? list.indexOf(S.time.slice(0, 5)) : -1;
    if (cur === -1) { var base = S.time ? (+S.time.slice(0, 2) * 60 + +S.time.slice(3)) : 14 * 60; cur = Math.floor(base / step()) - (dir > 0 ? 1 : 0); }
    var n = Math.min(list.length - 1, Math.max(0, cur + dir));
    setTime(list[n]);
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('button, [data-act]'); if (!el || el.disabled) return;
    var d = el.dataset;
    S.error = ''; S.note = '';
    if (d.go) { S.step = +d.go; render(); window.scrollTo({ top: app.offsetTop - 10, behavior: 'smooth' }); return; }
    if (d.day) { pickDay(d.day); render(); loadSpan().then(render); return; }
    if (d.pkg) {
      S.pkg = d.pkg; S.tier = +d.tier;
      if (S.tier === 4 && S.pax < 3) S.pax = Math.min(4, cfg.max_pax || 4);
      if (S.tier !== 4 && S.pax > 2) S.pax = 2;
      if (!isNightly()) S.nights = 1;
      syncGuests(); render(); return;
    }
    if (d.usetime) { setTime(d.usetime); return; }
    if (d.pax) { S.pax = +d.pax; syncGuests(); render(); return; }
    switch (d.act) {
      case 'prev': S.m--; if (S.m < 0) { S.m = 11; S.y--; } monthChanged(); break;
      case 'nextm': S.m++; if (S.m > 11) { S.m = 0; S.y++; } monthChanged(); break;
      case 'clear': S.inDay = ''; S.nights = 1; S.outPicked = false; S.time = ''; render(); break;
      case 'nminus': S.nights = Math.max(1, S.nights - 1); S.outPicked = true; render(); break;
      case 'nplus': S.nights = Math.min(MAX_NIGHTS, S.nights + 1); S.outPicked = true; render(); break;
      case 'tdown': shiftTime(-1); break;
      case 'tup': shiftTime(1); break;
      case 'exminus': S.extra = Math.max(0, S.extra - 1); render(); break;
      case 'explus': S.extra = Math.min(MAX_EXTRA, S.extra + 1); render(); break;
      case 'next':
        if (stepOk(S.step)) {
          S.step++;
          if (S.step === 2 && !S.time) S.time = '14:00';
          if (S.step === 3) syncGuests();
          render(); window.scrollTo({ top: app.offsetTop - 10, behavior: 'smooth' });
        }
        break;
      case 'back': S.step--; render(); break;
      case 'submit': submit(); break;
      case 'save': saveTicket(); break;
      case 'again': S.ticket = null; S.step = 1; S.inDay = ''; S.nights = 1; S.outPicked = false; S.pkg = ''; S.tier = 0; S.extra = 0; S.time = ''; S.agree = false; S.guests = []; blocksByMonth = {}; monthChanged(); break;
    }
  });
  app.addEventListener('change', function (e) {
    var el = e.target, d = el.dataset;
    if (d.act === 'baby') { S.baby = el.checked; return; }
    if (d.act === 'agree') { S.agree = el.checked; render(); return; }
    if (d.gfile != null) readId(+d.gfile, el.files && el.files[0]);
    if (el.id === 'tin') setTime(el.value);
  });
  app.addEventListener('input', function (e) {
    var el = e.target;
    if (el.id === 'tin') { setTime(el.value); return; }
    if (el.dataset.gname != null) { S.guests[+el.dataset.gname].name = el.value; refreshNav(); }
    if (el.id === 'em') {
      S.email = el.value; refreshNav();
      var h = document.getElementById('emhint');
      if (h) h.hidden = !S.email.trim() || /^[a-z0-9._%+-]+@gmail\.com$/i.test(S.email.trim()) || !/@/.test(S.email) || !/\.[a-z]{2,}$/i.test(S.email.trim());
    }
  });
  function refreshNav() {
    var nr = app.querySelector('.navrow'); if (!nr) return;
    var tmp = document.createElement('div'); tmp.innerHTML = navRow(); nr.replaceWith(tmp.firstChild);
    app.querySelectorAll('.steps button').forEach(function (b) { b.disabled = !canGo(+b.dataset.go); });
  }

  function monthChanged() {
    render();
    Promise.all([loadMonth(S.y, S.m), loadMonth(S.y, S.m + 1)]).then(render)
      .catch(function () { S.error = 'Could not load the calendar. Please check your connection and try again.'; render(); });
  }

  function submit() {
    if (!stepOk(4) || S.busy) return;
    var hp = document.getElementById('website');
    S.busy = true; S.error = ''; render();
    postJSON({
      action: 'createBooking', website: hp ? hp.value : '',
      guest_email: S.email.trim(), pax: S.pax, baby: S.baby, check_in: S.inDay + 'T' + S.time,
      package: pkgNow(), nights: nights(), extra_hours: S.extra, agree: S.agree,
      guests: S.guests.map(function (g) { return { full_name: g.name.trim(), id: { name: 'id', mime: g.file.mime, data: g.file.data } }; })
    }).then(function (t) {
      S.busy = false; S.ticket = t; render();
    }).catch(function (err) {
      S.busy = false;
      S.error = (err && err.message && err.message !== 'Failed to fetch') ? err.message : 'We could not send your booking. Please check your connection and try again.';
      if (/taken/i.test(S.error)) {
        S.step = 2; blocksByMonth = {};
        loadSpan().then(function () { return loadMonth(S.y, S.m); }).then(render);
      }
      render();
    });
  }

  // ---------- start ----------
  if (!API) { app.innerHTML = '<div class="loading">Booking is not set up yet.</div>'; return; }
  getJSON({ action: 'getPublicConfig' }).then(function (c) {
    cfg = c;
    cfg.rates.sort(function (a, b) { return a.hours - b.hours; });
    if (cfg.max_pax) S.pax = Math.min(2, cfg.max_pax);
    var md = minDay(); S.y = +md.slice(0, 4); S.m = +md.slice(5, 7) - 1;
    monthChanged();
  }).catch(function () {
    app.innerHTML = '<div class="loading">We could not load the booking calendar right now.<br><br>' +
      '<a class="pill gold" href="">Try again</a></div>';
  });
})();
</script>
</body>
</html>
