<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff portal — Luna's Oasis</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12100E">
<link rel="icon" type="image/png" href="../assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&amp;family=Jost:wght@300;400;500;600&amp;family=Pinyon+Script&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12100E; --ink2:#1B1714; --cream:#F3ECE0; --paper:#FBF7EE; --line:#E2D6C2;
  --gold:#C9A96E; --bronze:#7A5A2E; --text:#2A231D; --muted:#6B6157; --soft:#B9AE9F;
  --bad:#9A3B2E; --ok:#2F5A47; --warn:#8A5A12;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--cream);font-family:Jost,sans-serif;font-size:16px;line-height:1.5}
a{color:var(--gold)}
button,input,select,textarea{font:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:0;cursor:pointer;font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.pill.gold{background:var(--gold);color:var(--ink)}
.pill.dark{background:var(--ink);color:var(--gold)}
.pill.ghost{background:transparent;color:var(--cream);border:1px solid rgba(243,236,224,.45)}
.pill.line{background:transparent;color:var(--text);border:1.5px solid var(--text)}
.pill.red{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.pill.sm{min-height:36px;padding:0 14px;font-size:11px;letter-spacing:.14em}
.pill:disabled{opacity:.45;cursor:not-allowed}
.pill:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.err{background:#F6E3DF;color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px}
.okmsg{background:#E3EFE8;color:var(--ok);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px}
.label{display:block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.inp{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;color:var(--text);font-size:16px}
.inp:focus{outline:none;border-color:var(--bronze)}
.loading{padding:80px 16px;text-align:center;color:var(--soft)}
.spin{width:28px;height:28px;border-radius:50%;border:2px solid rgba(201,169,110,.3);border-top-color:var(--gold);animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* sign-in */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.lcard{width:100%;max-width:420px;background:var(--cream);color:var(--text);border-radius:26px;padding:32px 30px}
.lcard .logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.lcard .logo img{height:50px}
.lcard .logo span{font-family:'Cormorant Garamond',serif;font-size:18px;letter-spacing:.24em;text-transform:uppercase}
.lcard h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:36px;line-height:1.05;margin:0}
.lcard .sub{color:var(--muted);font-size:14px;margin:6px 0 4px}
.check{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--bronze)}
.lcard .foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;font-size:13px;color:var(--muted)}
.lcard .foot a{color:var(--bronze)}

/* top bar */
.top{border-bottom:1px solid rgba(201,169,110,.25);position:sticky;top:0;background:var(--ink);z-index:5}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:68px}
.brand{display:flex;align-items:center;gap:12px;color:var(--cream);text-decoration:none}
.brand img{height:40px}
.brand b{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:18px;letter-spacing:.22em;text-transform:uppercase}
.brand small{display:block;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.who{position:relative}
.who > button{display:flex;align-items:center;gap:10px;background:none;border:1px solid rgba(243,236,224,.3);color:var(--cream);border-radius:999px;padding:5px 14px 5px 5px;cursor:pointer}
.av{width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--cream);color:var(--text);border-radius:16px;min-width:230px;padding:8px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.menu .mh{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .mh div:first-child{font-weight:600}
.menu .mh div:last-child{font-size:12px;color:var(--muted);text-transform:capitalize}
.menu button,.menu a{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--text);cursor:pointer;text-decoration:none;font-size:14px}
.menu button:hover,.menu a:hover{background:#EDE3D2}

/* page */
.page{padding:26px 0 80px}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hello h1{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:40px;line-height:1;margin:0}
.hello p{color:var(--soft);margin:6px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--ink2);border:1px solid rgba(201,169,110,.3);border-radius:18px;padding:14px 18px}
.stat .k{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.stat .v{font-family:'Cormorant Garamond',serif;font-size:26px;line-height:1.15;margin-top:4px}
.stat .s{font-size:13px;color:var(--soft)}
.panel{background:var(--cream);color:var(--text);border-radius:24px;padding:20px 22px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.tab .n{opacity:.7;margin-left:4px}
.search{min-height:40px;max-width:260px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.rowb{cursor:pointer}
tr.rowb:hover td{background:#F7F0E3}
td.num,th.num{text-align:right;white-space:nowrap}
.ref{font-weight:600;white-space:nowrap}
.st{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.st.Pending{background:#FFF1CC;color:#7A5200}
.st.Confirmed{background:#DDEBE3;color:var(--ok)}
.st.Checked-in{background:#12100E;color:var(--gold)}
.st.Completed{background:#E6DCCB;color:var(--muted)}
.st.Cancelled,.st.No-show{background:#F6E3DF;color:var(--bad)}
.bal{color:var(--bad);font-weight:600}
.paid{color:var(--ok)}
.cards{display:none}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}

/* drawer */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--cream);color:var(--text);z-index:21;overflow:auto;box-shadow:-20px 0 50px rgba(0,0,0,.4)}
.dh{position:sticky;top:0;background:var(--ink);color:var(--cream);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:2}
.dh .t{font-family:'Cormorant Garamond',serif;font-size:26px;line-height:1}
.dh button{background:none;border:1px solid rgba(243,236,224,.4);color:var(--cream);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:18px}
.sec{padding:16px 20px;border-bottom:1px solid var(--line)}
.sec h3{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 10px}
.big{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;line-height:1.1}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:#F1E8DA;border-radius:12px;padding:8px 12px}
.kv small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row.tot{font-weight:600;font-size:15px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.glist .g{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.glist .g:last-child{border-bottom:0}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:inline-flex;align-items:center;gap:12px}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--text);cursor:pointer;font-size:18px}
.round:disabled{opacity:.35;cursor:default}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.hint.warn{color:var(--warn)}
.ticks label{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px;cursor:pointer}
.ticks input{width:20px;height:20px;accent-color:var(--ok)}
.viewer{position:fixed;inset:0;background:#0E0C0B;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.viewer img{max-width:100%;max-height:80vh;border-radius:10px}
.viewer iframe{width:min(820px,100%);height:80vh;border:0;background:#fff;border-radius:10px}
.viewer p{margin:0;color:var(--cream)}

/* page nav */
.pnav{display:flex;gap:6px;padding-top:16px}
.pnav button{background:transparent;border:1px solid rgba(243,236,224,.3);color:var(--cream);border-radius:999px;padding:8px 18px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
.pnav button[aria-current="page"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}

/* calendar */
.calbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.calbar h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:30px;margin:0;min-width:200px;text-align:center}
.calnav{display:flex;align-items:center;gap:8px}
.counts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.gkey{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px}
.gkey button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 10px;font-size:13px;color:var(--text);cursor:pointer;text-align:left}
.gkey .dot{width:12px;height:12px;border-radius:50%;flex:none}
.gkey small{display:block;color:var(--muted);font-size:11.5px}
.cdow,.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cdow div{text-align:center;font-size:11px;letter-spacing:.16em;color:var(--muted);padding:2px 0 4px}
.cday{min-height:92px;border-radius:12px;padding:7px;display:flex;flex-direction:column;gap:3px;background:var(--paper);border:1.5px solid #E6DCCB;min-width:0}
.cday.busy{border-color:#D3C4AA}
.cday.today{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold) inset}
.cday.past{opacity:.6}
.cday.blank{visibility:hidden}
.cday .top1{display:flex;justify-content:space-between;gap:4px}
.cday .top1 b{font-size:13px}
.cday .top1 span{font-size:10px;color:var(--muted)}
.chip2{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;color:#fff;border:0;cursor:pointer;text-align:left}
.more{font-size:10px;color:var(--muted)}
.strip{position:relative;display:block;height:6px;border-radius:3px;margin-top:auto;background:#E6DCCB;overflow:hidden}
.strip span{position:absolute;top:0;bottom:0;border-radius:3px}
.strip span.clean{background:repeating-linear-gradient(45deg,#B9AE9F 0 3px,transparent 3px 6px);border-radius:0}

/* records */
.sel{min-height:36px;width:auto;padding:0 10px;font-size:14px}
.xl{font-size:12px;color:var(--muted);align-self:center}
.ph{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:26px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:6px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi small{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.big2{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.kpi.big2 small{color:var(--gold)}
.kpi.big2 span{color:var(--soft)}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;align-items:end;height:200px;margin-top:10px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;background:none;border:0;cursor:pointer;padding:0;color:var(--text)}
.bar .bb{width:100%;max-width:46px;border-radius:10px 10px 4px 4px}
.bar .bv{font-size:11px;color:var(--muted)}
.bar .bl{font-size:12px}
.bar[aria-current="true"] .bl{font-weight:700;color:var(--bronze)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.meth{margin-bottom:8px}
.mbar{height:8px;border-radius:999px;background:#E6DCCB;overflow:hidden}
.mbar span{display:block;height:100%;border-radius:999px;background:#4F7A63}
select.inp{appearance:auto}

@media (max-width: 1100px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width: 820px){
  .kpis{grid-template-columns:1fr 1fr}
  .kpi b{font-size:22px}
  .twocol{grid-template-columns:1fr}
  .bars{gap:3px;height:200px}
  .bar .bv{font-size:8px}
  .bar .bl{font-size:10px}
  .ph{font-size:22px}
  .pnav{padding-top:12px}
  .pnav button{flex:1;padding:8px 10px;font-size:11px;letter-spacing:.12em}
  .calbar h2{font-size:24px;min-width:0}
  .cdow,.cgrid{gap:3px}
  .cdow div{font-size:9px;letter-spacing:.06em}
  .cday{min-height:62px;padding:4px;border-radius:8px}
  .cday .top1 span{display:none}
  .chip2{font-size:9px;padding:0 3px;border-radius:3px}
  .gkey button{flex:1 1 100%}
  .wrap{padding:0 14px}
  .brand b{font-size:14px}
  .brand img{height:32px}
  .who > button span.n{display:none}
  .who > button{padding:4px}
  .hello h1{font-size:30px}
  .stats{grid-template-columns:1fr;gap:8px}
  .stat{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .stat .v{font-size:20px;margin:0;text-align:right}
  .panel{padding:14px;border-radius:18px}
  .search{max-width:none;width:100%}
  table{display:none}
  .cards{display:block}
  .card{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:12px 14px;margin-top:8px;cursor:pointer;width:100%;text-align:left;color:var(--text)}
  .card .l1{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .card .l2{font-size:14px;margin-top:4px}
  .card .l3{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
  .lcard{padding:26px 20px}
}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spin"></div>Loading…</div></div>

<script src="../js/config.js"></script>
<script>
(function () {
  'use strict';
  var API = window.LUNA_CONFIG && window.LUNA_CONFIG.API_URL;
  var app = document.getElementById('app');
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var HOUR = 3600000, PH = 8 * HOUR;

  var S = {
    token: '', me: null, data: null, page: 'bookings', cy: 0, cm: 0, rmode: 'month', ry: 0, rm: 0, rfilter: 'all', rmsg: '',
    past: { name: '', date: '', time: '14:00', pkg: '22H', pax: 2, nights: 1, extra: 0, amount: '', method: 'GCash', depBack: true }, tab: 'upcoming', q: '', open: '', menu: false,
    busy: false, error: '', msg: '', loginErr: '',
    pay: { amount: '', method: 'GCash', refno: '' }, ext: 1, dep: { method: 'GCash', deduction: '', reason: '' }
  };

  // ---------- helpers ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function peso(n) { return '₱' + Math.round(Number(n) || 0).toLocaleString('en-PH'); }
  function ms(v) { if (!v) return 0; var p = v.slice(0, 10).split('-'), t = (v.slice(11) || '00:00').split(':'); return Date.UTC(+p[0], +p[1] - 1, +p[2], +t[0], +t[1]) - PH; }
  function when(v) {
    if (!v) return '—';
    var d = new Date(ms(v) + PH), h = d.getUTCHours(), m = d.getUTCMinutes();
    return DOW[d.getUTCDay()] + ', ' + MON[d.getUTCMonth()] + ' ' + d.getUTCDate() + ' · ' + ((h + 11) % 12 + 1) + ':' + (m < 10 ? '0' : '') + m + ' ' + (h < 12 ? 'AM' : 'PM');
  }
  function nowMs() { return Date.now(); }
  function initials(n) { return String(n || '?').replace(/^Ms\.?\s+|^Mr\.?\s+/i, '').split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase(); }
  function store(k, v) { try { if (v === null) { localStorage.removeItem(k); sessionStorage.removeItem(k); } else (S.remember ? localStorage : sessionStorage).setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lead(b) { return (b.guests[0] && b.guests[0].name) || b.guest_email; }
  function hours(b) { return Math.round((ms(b.check_out) - ms(b.check_in)) / HOUR); }
  function active(b) { return ['Cancelled', 'No-show'].indexOf(b.status) === -1; }

  function post(body) {
    body.token = S.token;
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) { var e = new Error(j.error || 'Something went wrong.'); e.auth = j.auth; throw e; }
        return j.data;
      });
  }
  function act(body, okMsg) {   // staff action that returns fresh bookings
    S.busy = true; S.error = ''; S.msg = ''; render();
    return post(body).then(function (d) {
      S.busy = false; S.data = d; S.me = d.me; S.msg = okMsg || ''; render();
    }).catch(fail);
  }
  function fail(err) {
    S.busy = false;
    if (err && err.auth) { signOut('Please sign in again.'); return; }
    S.error = err && err.message && err.message !== 'Failed to fetch' ? err.message : 'Could not reach the server. Please check your connection.';
    render();
  }

  // ---------- sign-in ----------
  function renderLogin() {
    app.innerHTML = '<div class="login"><form class="lcard" id="lf" novalidate>' +
      '<div class="logo"><img src="../assets/img/logo.png" alt=""><span>Luna\'s Oasis</span></div>' +
      '<h1>Staff sign-in</h1><p class="sub">For Luna\'s Oasis staff only.</p>' +

  // ---------- calendar ----------
  var PAL = ['#8E3B46', '#2F5A47', '#6B4A6E', '#A8834A', '#3D5A80', '#B5651D', '#5F7161', '#7A2A16', '#4A5568', '#9C6B98', '#8C6A3C', '#476C78'];
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function calendarHtml() {
    var y = S.cy, m = S.cm, DAY = 24 * HOUR;
    var mStart = Date.UTC(y, m, 1) - PH, mEnd = Date.UTC(y, m + 1, 1) - PH;
    var gap = (S.data.settings.cleaning_gap_hours || 0) * HOUR;
    var list = S.data.bookings.filter(function (b) { return active(b) && ms(b.check_in) < mEnd && ms(b.check_out) + gap > mStart; })
      .sort(function (a, b) { return ms(a.check_in) - ms(b.check_in); });

    for (var d = 1; d <= dim; d++) {

        }

    return '<div class="hello"><div><h1>Calendar</h1><p>Every booking, time-in, time-out and extension. Tap a name to open the booking.</p></div>' +
      '<button type="button" class="pill ghost sm" data-act="refresh">↻ Refresh</button></div>' +

      '<button type="button" class="pill line sm" data-cal="0">Today</button></div>' +

  // ---------- records & earnings (admin & co-admin) ----------
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  function isFinance() { return S.me && (S.me.role === 'admin' || S.me.role === 'coadmin'); }
  function staffName(email) {
    var s = (S.data.staff || []).filter(function (x) { return x.email === String(email).toLowerCase(); })[0];
    return s ? s.name : String(email || '').split('@')[0];
  }
  function inPeriod(v, mode, y, m) {
    if (!v) return false;
    var yy = +v.slice(0, 4), mm = +v.slice(5, 7) - 1;
    return mode === 'year' ? yy === y : yy === y && mm === m;
  }
  function money(b) {   // what a booking means for earnings (deposit is never income)
    var stay = b.total - b.deposit, dep = b.deposit_info || {};
    var paidStay = Math.min(b.paid_total, stay);
    var held = !dep.refunded_at ? Math.min(b.deposit, Math.max(0, b.paid_total - stay)) : 0;
    return { stay: stay, paidStay: paidStay, kept: dep.refunded_at ? (dep.deduction || 0) : 0, toCollect: Math.max(0, stay - b.paid_total), held: held };
  }
  function periodStats(mode, y, m) {
    var bs = S.data.bookings.filter(function (b) { return active(b) && inPeriod(b.check_in, mode, y, m); });
    var t = { list: bs, count: bs.length, booked: 0, earn: 0, toCollect: 0, bal: 0, balCount: 0, paidCount: 0, held: 0, heldCount: 0, ret: 0, retCount: 0 };
    bs.forEach(function (b) {
      var x = money(b);
      t.booked += x.stay; t.earn += x.paidStay + x.kept; t.toCollect += x.toCollect;
      if (b.balance > 0) { t.bal += b.balance; t.balCount++; } else t.paidCount++;
      if (x.held > 0) { t.held += x.held; t.heldCount++; }
    });
    S.data.bookings.forEach(function (b) {
      var d = b.deposit_info;
      if (d && d.refunded_at && inPeriod(d.refunded_at, mode, y, m)) { t.ret += d.refunded_amount; t.retCount++; }
    });
    return t;
  }
  function ledger(mode, y, m) {
    var out = [];
    S.data.bookings.forEach(function (b) {
      b.payments.forEach(function (p) {
        if (inPeriod(p.at, mode, y, m)) out.push({ at: p.at, ref: b.ref, guest: lead(b), type: 'Payment', method: p.method, amount: p.amount, refno: p.reference_no, by: p.by });
      });
      var d = b.deposit_info;
      if (d && d.refunded_at && inPeriod(d.refunded_at, mode, y, m)) out.push({ at: d.refunded_at, ref: b.ref, guest: lead(b), type: 'Deposit returned', method: d.refund_method, amount: -d.refunded_amount, refno: '', by: d.handled_by });
    });
    return out.sort(function (a, b) { return ms(b.at) - ms(a.at); });
  }
  function pastPreview() {
    var P = S.past, st = S.data.settings, r = (st.rates || []).filter(function (x) { return x.package === P.pkg; })[0];
    if (!r) return { ok: false, text: 'Choose a package.' };
    var nightly = r.hours >= 20, n = nightly ? Math.max(1, +P.nights || 1) : 0, base = +P.pax > 2 ? r.rate_3_4_pax : r.rate_1_2_pax;
    var stay = 0, disc = 0;
    for (var i = 0; i < Math.max(1, n); i++) {
      var day = P.date ? new Date(ms(P.date + 'T00:00') + PH + i * 24 * HOUR).toISOString().slice(0, 10) : '';
      var pr = (st.promos || []).filter(function (p) { return day && p.start_date <= day && day <= p.end_date; })[0];
      stay += base; disc += pr ? Math.round(base * pr.percent_off / 100) : 0;
    }
    var stayHrs = n > 1 ? (n - 1) * (24 - r.hours) : 0;
    var total = stay - disc + (stayHrs + (+P.extra || 0)) * st.extra_hour_rate;
    var endMs = P.date ? ms(P.date + 'T' + (P.time || '00:00')) + ((nightly ? 24 * (n - 1) + r.hours : r.hours) + (+P.extra || 0)) * HOUR : 0;
    if (!P.name.trim()) return { ok: false, total: total, text: 'Enter the guest\'s name.' };
    if (!P.date) return { ok: false, total: total, text: 'Enter the check-in date.' };
    if (endMs > Date.now()) return { ok: false, total: total, text: 'That stay is not over yet. Use the booking page for current and future stays.' };
    var amt = P.amount === '' ? total : +P.amount;
    return { ok: true, total: total, amt: amt, text: r.hours + ' hrs' + (n > 1 ? ' × ' + n + ' nights' : '') + ' · ' + (+P.pax > 2 ? 4 : 2) + ' pax' + (+P.extra ? ' + ' + P.extra + ' extra hr' : '') + (disc ? ' · promo rate' : '') + ' — adds ' + peso(amt) + ' to earnings' };
  }

  function recordsHtml() {
    if (!isFinance()) {
      return '<div class="hello"><div><h1>Records &amp; earnings</h1><p>For the finance team only.</p></div></div>' +
        '<section class="panel"><p style="margin:0">Records &amp; earnings are handled by the admin and co-admin. You can still record payments from <b>Bookings</b>.</p></section>';
    }
    var mode = S.rmode, y = S.ry, m = S.rm, MONS = MONTHS;
    var short = mode === 'year' ? String(y) : MONS[m].slice(0, 3) + ' ' + y;
    var t = periodStats(mode, y, m);
    var py = mode === 'year' ? y - 1 : (m === 0 ? y - 1 : y), pm = m === 0 ? 11 : m - 1;
    var prev = periodStats(mode, py, pm).count;
    // year chart
    var yearEarn = MONS.map(function (_, i) { return periodStats('month', y, i).earn; });
    var yMax = Math.max.apply(null, [1].concat(yearEarn)), best = yearEarn.indexOf(Math.max.apply(null, yearEarn));
    var bars = yearEarn.map(function (v, i) {
      return '<button type="button" class="bar" data-rmonth="' + i + '" aria-label="' + MONS[i] + ' ' + peso(v) + '"' + (mode === 'month' && m === i ? ' aria-current="true"' : '') + '>' +
        '<span class="bv">' + (v ? '₱' + (v / 1000).toFixed(1) + 'k' : '') + '</span>' +
        '<span class="bb" style="height:' + Math.max(v ? 4 : 2, Math.round(v / yMax * 150)) + 'px;background:' + (i === best && v ? '#A8834A' : '#4F7A63') + ';opacity:' + (v ? 1 : .25) + '"></span>' +
        '<span class="bl">' + MONS[i].slice(0, 3) + '</span></button>';
    }).join('');
    // breakdown
    var rows = [];
    (S.data.settings.rates || []).forEach(function (r) {
      [2, 4].forEach(function (tier) {
        var g = t.list.filter(function (b) { return b.package === r.package && (b.pax > 2 ? 4 : 2) === tier; });
        rows.push([r.hours + ' hrs · ' + tier + ' pax', '(' + g.length + ')', g.reduce(function (a, b) { return a + b.stay_rate; }, 0)]);
      });
    });
    var extH = t.list.reduce(function (a, b) { return a + b.extra_hours; }, 0);
    rows.push(['Extra & stay-over hours', '(' + extH + ' hrs × ' + peso(S.data.settings.extra_hour_rate) + ')', t.list.reduce(function (a, b) { return a + b.extras_total; }, 0)]);
    var disc = t.list.reduce(function (a, b) { return a + b.discount; }, 0);
    if (disc) rows.push(['Promo discounts', '', -disc]);
    var led = ledger(mode, y, m);
    var methods = ['GCash', 'Bank transfer'].map(function (k) { return [k, led.filter(function (l) { return l.type === 'Payment' && l.method === k; }).reduce(function (a, l) { return a + l.amount; }, 0)]; });
    var mMax = Math.max(1, methods[0][1], methods[1][1]);
    var byStaff = {};
    led.filter(function (l) { return l.type === 'Payment'; }).forEach(function (l) { var k = staffName(l.by); byStaff[k] = byStaff[k] || [0, 0]; byStaff[k][0]++; byStaff[k][1] += l.amount; });
    // table
    var F = {
      all: function () { return true; },
      unpaid: function (b) { return b.balance > 0; },
      hold: function (b) { return b.balance <= 0 && money(b).held > 0; },
      done: function (b) { return b.balance <= 0 && b.deposit_info && b.deposit_info.refunded_at; }

    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function exportCsv(kind) {

            '<div><label class="sr" for="dr">Reason</label><input class="inp" id="dr" placeholder="Reason (if any)" value="' + esc(S.dep.reason) + '"></div></div>' +
            '<div class="seg" style="margin-top:8px" role="group" aria-label="Return by">' + ['GCash', 'Bank transfer'].map(function (m) { return '<button type="button" data-depm="' + m + '" aria-pressed="' + (S.dep.method === m) + '">' + m + '</button>'; }).join('') + '</div>' +
            '<button type="button" class="pill gold sm" style="margin-top:10px" data-act="refund"' + (dep.photo_ok && dep.items_ok && !S.busy ? '' : ' disabled') + '>Mark ' + peso(refundAmt) + ' returned</button>') +
        '</div>' : '') +
      '</aside>';
  }

  function chpwBox() {
    return '<div class="shade" data-act="chpwclose"></div><aside class="drawer" role="dialog" aria-label="Change my password" style="height:auto;bottom:auto;top:10%;right:50%;transform:translateX(50%);border-radius:22px;width:min(420px,94%)">' +
      '<div class="dh" style="border-radius:22px 22px 0 0"><div class="t">Change my password</div><button type="button" data-act="chpwclose" aria-label="Close">✕</button></div>' +
      '<form class="sec" id="cpf" style="border:0">' +
      '<label class="label" for="cp0" style="margin-top:0">Current password</label><input class="inp" id="cp0" type="password" autocomplete="current-password">' +
      '<label class="label" for="cp1">New password (8+ characters)</label><input class="inp" id="cp1" type="password" autocomplete="new-password">' +
      (S.error ? '<div class="err" role="alert">' + esc(S.error) + '</div>' : '') +
      (S.msg ? '<div class="okmsg" role="status">' + esc(S.msg) + '</div>' : '') +
      '<button class="pill gold" style="width:100%;margin-top:16px"' + (S.busy ? ' disabled' : '') + '>Save new password</button></form></aside>';
  }

  function viewId(ref, no) {
    var box = document.createElement('div');
    box.className = 'viewer'; box.setAttribute('role', 'dialog');
    box.innerHTML = '<div class="spin"></div><p>Loading ID…</p>';
    document.body.appendChild(box);
    post({ action: 'staffGetId', ref: ref, guest_no: no }).then(function (d) {
      var url = 'data:' + d.mime + ';base64,' + d.data;
      if (d.mime === 'application/pdf') {
        var bin = atob(d.data), arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
      }
      box.innerHTML = '<p>' + esc(d.name) + '</p>' + (d.mime === 'application/pdf' ? '<iframe src="' + url + '" title="ID"></iframe><a class="pill ghost sm" href="' + url + '" target="_blank" rel="noopener">Open PDF</a>' : '<img src="' + url + '" alt="ID of ' + esc(d.name) + '">') +
        '<button type="button" class="pill gold">Close</button>';
      box.querySelector('button').onclick = function () { box.remove(); };
    }).catch(function (err) {
      if (err.auth) { box.remove(); signOut('Please sign in again.'); return; }
      box.innerHTML = '<p>' + esc(err.message) + '</p><button type="button" class="pill gold">Close</button>';
      box.querySelector('button').onclick = function () { box.remove(); };
    });
  }

  function openBooking(ref) {
    S.open = ref; S.error = ''; S.msg = ''; S.ext = 1;
    var b = S.data.bookings.filter(function (x) { return x.ref === ref; })[0];
    S.pay = { amount: b && b.balance > 0 ? String(b.balance) : '', method: 'GCash', refno: '' };
    S.dep = { method: 'GCash', deduction: '', reason: '' };
    render();
  }

  // ---------- events ----------
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act],[data-tab],[data-open],[data-status],[data-id],[data-paym],[data-depm],[data-page],[data-cal],[data-rmode],[data-rmonth],[data-rfilter],[data-csv],[data-pastm]');
    if (!el || el.disabled) { if (S.menu && !e.target.closest('.menu')) { S.menu = false; render(); } return; }
    var d = el.dataset, b = S.open && S.data.bookings.filter(function (x) { return x.ref === S.open; })[0];
    if (d.tab) { S.tab = d.tab; render(); return; }
    if (d.page) { S.page = d.page; S.error = ''; S.rmsg = ''; render(); window.scrollTo(0, 0); return; }
    if (d.rmode) { S.rmode = d.rmode; render(); return; }
    if (d.rmonth != null) { S.rmode = 'month'; S.rm = +d.rmonth; render(); return; }
    if (d.rfilter) { S.rfilter = d.rfilter; render(); return; }
    if (d.csv) { exportCsv(d.csv); return; }
    if (d.pastm) { S.past.method = d.pastm; render(); return; }
    if (d.cal != null) {
      if (d.cal === '0') { var t = new Date(Date.now() + PH); S.cy = t.getUTCFullYear(); S.cm = t.getUTCMonth(); }
      else { S.cm += +d.cal; if (S.cm < 0) { S.cm = 11; S.cy--; } if (S.cm > 11) { S.cm = 0; S.cy++; } }
      render(); return;
    }
    if (d.open) { openBooking(d.open); return; }
    if (d.id) { viewId(S.open, +d.id); return; }
    if (d.paym) { S.pay.method = d.paym; render(); return; }
    if (d.depm) { S.dep.method = d.depm; render(); return; }
    if (d.status) {
      var label = el.textContent;
      if ((d.status === 'Cancelled' || d.status === 'No-show') && !window.confirm(label + ' ' + b.ref + '? Its time slot will be freed for other guests.')) return;
      act({ action: 'staffSetStatus', ref: b.ref, status: d.status }, b.ref + ' is now ' + d.status + (d.status === 'Confirmed' && b.status === 'Pending' ? '. We emailed the guest.' : '.'));
      return;
    }
    switch (d.act) {
      case 'menu': S.menu = !S.menu; render(); break;
      case 'logout': signOut(''); break;
      case 'refresh': S.error = ''; loadAll(); break;
      case 'close': S.open = ''; S.error = ''; S.msg = ''; render(); break;
      case 'chpw': S.menu = false; S.chpw = true; S.error = ''; S.msg = ''; render(); break;
      case 'chpwclose': S.chpw = false; S.error = ''; S.msg = ''; render(); break;
      case 'pay':
        if (!(Number(S.pay.amount) > 0)) { S.error = 'Please enter the amount paid.'; render(); return; }
        act({ action: 'staffRecordPayment', ref: b.ref, amount: Number(S.pay.amount), method: S.pay.method, reference_no: S.pay.refno }, 'Payment of ' + peso(S.pay.amount) + ' recorded.')
          .then(function () { var nb = S.data.bookings.filter(function (x) { return x.ref === S.open; })[0]; S.pay = { amount: nb && nb.balance > 0 ? String(nb.balance) : '', method: S.pay.method, refno: '' }; render(); });
        break;
      case 'payall':
        if (!window.confirm('Record ' + peso(b.balance) + ' paid by ' + S.pay.method + ' for ' + b.ref + '?')) return;
        act({ action: 'staffRecordPayment', ref: b.ref, amount: b.balance, method: S.pay.method, reference_no: S.pay.refno }, 'Balance marked as paid.');
        break;
      case 'exm': S.ext = Math.max(1, S.ext - 1); render(); break;
      case 'exp': S.ext = Math.min(S.data.settings.max_extend_hours, S.ext + 1); render(); break;
      case 'extend': act({ action: 'staffExtend', ref: b.ref, hours: S.ext }, 'Extended by ' + S.ext + ' hr' + (S.ext > 1 ? 's' : '') + '.').then(function () { S.ext = 1; render(); }); break;
      case 'addpast':
        var pv = pastPreview();
        if (!pv.ok) { S.error = pv.text; render(); return; }
        S.busy = true; S.error = ''; S.rmsg = ''; render();
        post({ action: 'staffAddPast', guest_name: S.past.name.trim(), check_in: S.past.date + 'T' + (S.past.time || '14:00'), package: S.past.pkg, pax: +S.past.pax, nights: +S.past.nights || 1,
          extra_hours: +S.past.extra || 0, amount_paid: pv.amt, method: S.past.method, deposit_returned: S.past.depBack }).then(function (dd) {
          S.busy = false; S.data = dd; S.rmsg = S.past.name.trim() + ' added as ' + dd.added + ' — ' + peso(pv.amt) + ' now counts in earnings.';
          var cy = +S.past.date.slice(0, 4), cm = +S.past.date.slice(5, 7) - 1; S.rmode = 'month'; S.ry = cy; S.rm = cm;
          S.past = { name: '', date: '', time: '14:00', pkg: S.past.pkg, pax: S.past.pax, nights: 1, extra: 0, amount: '', method: S.past.method, depBack: true };
          render(); window.scrollTo(0, 0);
        }).catch(fail);
        break;
      case 'refund':
        var amt = Math.max(0, b.deposit - (Number(S.dep.deduction) || 0));
        if (!window.confirm('Mark ' + peso(amt) + ' deposit as returned by ' + S.dep.method + '?')) return;
        act({ action: 'staffDeposit', ref: b.ref, refund: true, method: S.dep.method, deduction: Number(S.dep.deduction) || 0, reason: S.dep.reason }, 'Deposit returned. Booking completed.');
        break;
    }
  });
  app.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && (S.open || S.chpw)) { S.open = ''; S.chpw = false; S.error = ''; render(); }
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.open) openBooking(e.target.dataset.open);
  });
  app.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'q') { S.q = e.target.value; render(); }
    var pmap = { pn: 'name', pd: 'date', pt: 'time', pnt: 'nights', pex: 'extra', pam: 'amount' };
    if (pmap[id]) {
      S.past[pmap[id]] = e.target.value;
      var pv = pastPreview(), el = document.getElementById('pprev');
      if (el) { el.textContent = pv.text; el.style.color = pv.ok ? 'var(--ok)' : ''; }
      var am = document.getElementById('pam'); if (am && pv.total) am.placeholder = pv.total;
    }
    if (id === 'pa') S.pay.amount = e.target.value;
    if (id === 'pr') S.pay.refno = e.target.value;
    if (id === 'dr') S.dep.reason = e.target.value;
    if (id === 'dd') { S.dep.deduction = e.target.value; var btn = app.querySelector('[data-act="refund"]'), b = S.data.bookings.filter(function (x) { return x.ref === S.open; })[0]; if (btn && b) btn.textContent = 'Mark ' + peso(Math.max(0, b.deposit - (Number(e.target.value) || 0))) + ' returned'; }
  });
  app.addEventListener('change', function (e) {
    var id = e.target.id;
    if (id === 'rmsel') { S.rm = +e.target.value; render(); return; }
    if (id === 'rysel') { S.ry = +e.target.value; render(); return; }
    if (id === 'ppk') { S.past.pkg = e.target.value; render(); return; }
    if (id === 'ppx') { S.past.pax = +e.target.value; render(); return; }
    if (id === 'pdb') { S.past.depBack = e.target.checked; return; }
    if (e.target.dataset.depf) act({ action: 'staffDeposit', ref: S.open, field: e.target.dataset.depf, value: e.target.checked });
  });
  app.addEventListener('submit', function (e) {
    if (e.target.id !== 'cpf') return;
    e.preventDefault();
    var o = document.getElementById('cp0').value, n = document.getElementById('cp1').value;
    if (n.length < 8) { S.error = 'The new password needs at least 8 characters.'; render(); return; }
    S.busy = true; S.error = ''; render();
    post({ action: 'staffChangePassword', old_password: o, new_password: n }).then(function (d) {
      S.busy = false; S.token = d.token; S.remember = !!(function () { try { return localStorage.getItem('lo_staff'); } catch (x) { return ''; } })(); store('lo_staff', d.token);
      S.msg = 'Password changed.'; render();
    }).catch(fail);
  });

  // ---------- start ----------
  if (!API) { app.innerHTML = '<div class="loading">The portal is not set up yet.</div>'; return; }
  var t0 = new Date(Date.now() + PH); S.cy = S.ry = t0.getUTCFullYear(); S.cm = S.rm = t0.getUTCMonth();
  S.token = load('lo_staff');
  if (S.token) loadAll(); else renderLogin();
})();
</script>
</body>
</html>
