<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff portal — Luna's Oasis</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12100E">
<link rel="icon" type="image/png" href="../assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&amp;family=Jost:wght@300;400;500;600&amp;family=Pinyon+Script&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12100E; --ink2:#1B1714; --cream:#F3ECE0; --paper:#FBF7EE; --line:#E2D6C2;
  --gold:#C9A96E; --bronze:#7A5A2E; --text:#2A231D; --muted:#6B6157; --soft:#B9AE9F;
  --bad:#9A3B2E; --ok:#2F5A47; --warn:#8A5A12;
}
*{box-sizing:border-box}
a{color:var(--gold)}
button,input,select,textarea{font:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:0;cursor:pointer;font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.pill.gold{background:var(--gold);color:var(--ink)}
.pill.dark{background:var(--ink);color:var(--gold)}
.pill.ghost{background:transparent;color:var(--cream);border:1px solid rgba(243,236,224,.45)}
.pill.line{background:transparent;color:var(--text);border:1.5px solid var(--text)}
.pill.red{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.pill.sm{min-height:36px;padding:0 14px;font-size:11px;letter-spacing:.14em}
.pill:disabled{opacity:.45;cursor:not-allowed}
.pill:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.err{background:#F6E3DF;color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px}
.okmsg{background:#E3EFE8;color:var(--ok);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px}
.label{display:block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.inp{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;color:var(--text);font-size:16px}
input[type="time"].inp,input[type="date"].inp{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;text-align:left;line-height:44px}
input[type="time"].inp::-webkit-date-and-time-value,input[type="date"].inp::-webkit-date-and-time-value{text-align:left}
.uform,.ulog,.cols>.panel{min-width:0}
.inp:focus{outline:none;border-color:var(--bronze)}
.loading{padding:80px 16px;text-align:center;color:var(--soft)}
.spin{width:28px;height:28px;border-radius:50%;border:2px solid rgba(201,169,110,.3);border-top-color:var(--gold);animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

body{margin:0;color:var(--cream);font-family:Jost,sans-serif;font-size:16px;line-height:1.5}
/* stars */
body{background-color:var(--ink);background-image:radial-gradient(1.5px 1.5px at 67.7% 42.9%,rgba(243,236,224,0.46),transparent),radial-gradient(1px 1px at 58.4% 45.4%,rgba(243,236,224,0.45),transparent),radial-gradient(2px 2px at 78.8% 69.5%,rgba(243,236,224,0.42),transparent),radial-gradient(1px 1px at 57.3% 52.5%,rgba(243,236,224,0.74),transparent),radial-gradient(1px 1px at 72.5% 29.2%,rgba(243,236,224,0.79),transparent),radial-gradient(1px 1px at 12.6% 42.0%,rgba(243,236,224,0.68),transparent),radial-gradient(1.5px 1.5px at 15.9% 48.9%,rgba(243,236,224,0.32),transparent),radial-gradient(1px 1px at 66.5% 75.9%,rgba(243,236,224,0.59),transparent),radial-gradient(1px 1px at 86.8% 31.7%,rgba(243,236,224,0.65),transparent),radial-gradient(1px 1px at 59.2% 57.8%,rgba(243,236,224,0.53),transparent),radial-gradient(1px 1px at 83.3% 93.6%,rgba(243,236,224,0.54),transparent),radial-gradient(2px 2px at 66.1% 6.9%,rgba(243,236,224,0.65),transparent),radial-gradient(2px 2px at 64.4% 98.3%,rgba(243,236,224,0.71),transparent),radial-gradient(1px 1px at 28.9% 38.8%,rgba(243,236,224,0.63),transparent),radial-gradient(1px 1px at 3.2% 46.2%,rgba(243,236,224,0.38),transparent),radial-gradient(1px 1px at 12.5% 6.8%,rgba(243,236,224,0.68),transparent),radial-gradient(2px 2px at 13.7% 25.3%,rgba(243,236,224,0.50),transparent),radial-gradient(1px 1px at 86.4% 8.9%,rgba(243,236,224,0.52),transparent),radial-gradient(1px 1px at 54.8% 87.6%,rgba(243,236,224,0.71),transparent),radial-gradient(1px 1px at 85.7% 28.3%,rgba(243,236,224,0.51),transparent),radial-gradient(1px 1px at 36.2% 87.7%,rgba(243,236,224,0.78),transparent),radial-gradient(2px 2px at 15.8% 18.3%,rgba(243,236,224,0.42),transparent),radial-gradient(1px 1px at 23.9% 48.5%,rgba(243,236,224,0.59),transparent),radial-gradient(1px 1px at 26.7% 1.4%,rgba(243,236,224,0.51),transparent),radial-gradient(1px 1px at 37.2% 56.5%,rgba(243,236,224,0.78),transparent),radial-gradient(1px 1px at 68.7% 51.5%,rgba(243,236,224,0.61),transparent),radial-gradient(1.5px 1.5px at 67.3% 6.3%,rgba(243,236,224,0.75),transparent),radial-gradient(2px 2px at 77.4% 86.7%,rgba(243,236,224,0.70),transparent),radial-gradient(1px 1px at 39.5% 40.1%,rgba(243,236,224,0.35),transparent),radial-gradient(1px 1px at 63.2% 7.1%,rgba(243,236,224,0.33),transparent),radial-gradient(1.5px 1.5px at 21.5% 16.9%,rgba(243,236,224,0.47),transparent),radial-gradient(1px 1px at 6.2% 1.0%,rgba(243,236,224,0.38),transparent),radial-gradient(1px 1px at 10.9% 36.6%,rgba(243,236,224,0.31),transparent),radial-gradient(1px 1px at 86.7% 61.2%,rgba(243,236,224,0.37),transparent),radial-gradient(1.5px 1.5px at 25.7% 35.0%,rgba(243,236,224,0.48),transparent),radial-gradient(1px 1px at 13.0% 84.2%,rgba(243,236,224,0.80),transparent),radial-gradient(1px 1px at 46.7% 48.4%,rgba(243,236,224,0.34),transparent),radial-gradient(1px 1px at 11.0% 34.6%,rgba(243,236,224,0.43),transparent),radial-gradient(1px 1px at 82.2% 16.8%,rgba(243,236,224,0.31),transparent),radial-gradient(2px 2px at 94.2% 52.8%,rgba(243,236,224,0.37),transparent);background-attachment:fixed}

/* sign-in (split screen) */
.login{min-height:100vh;display:flex;flex-wrap:wrap}
.lside{flex:1 1 480px;min-height:520px;display:flex;align-items:center;justify-content:center;border-right:1px solid rgba(201,169,110,.25);overflow:hidden}
.lside .in{text-align:center;color:var(--cream);padding:48px 32px}
.ringbox{position:relative;width:300px;height:300px;margin:0 auto}
.ringbox svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 70s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.ringbox svg{animation:none}}
.ringbox .ph2{position:absolute;inset:40px;border-radius:50%;border:1px solid rgba(201,169,110,.45);padding:8px}
.ringbox .ph2 div{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#1B1714}
.ringbox img{width:100%;height:100%;object-fit:cover;object-position:40% 60%;display:block}
.script{font-family:'Pinyon Script',cursive;color:var(--gold);line-height:1}
.oasis{font-family:'Cormorant Garamond',serif;font-weight:300;letter-spacing:.3em;padding-left:.3em;line-height:1}
.lside .script{font-size:76px;margin-top:18px}
.lside .oasis{font-size:54px}
.rule{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:22px;font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.rule::before,.rule::after{content:"";width:54px;height:1px;background:var(--gold)}
.lmain{flex:1 1 480px;display:flex;align-items:center;justify-content:center;padding:56px 24px;background:#1B1714}
.lcard{width:100%;max-width:480px;background:var(--cream);color:#2E2621;border:1px solid #B8945A;border-radius:22px;padding:38px 34px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.lcard .wb{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--bronze);margin:0 0 10px}
.lcard h1{font-family:'Cormorant Garamond',serif;font-size:50px;font-weight:500;margin:0 0 26px;line-height:1}
.lbl{display:block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;margin:0 0 8px;color:#5E554C}
.linp{width:100%;min-height:52px;border:1.5px solid #D3C4AA;border-radius:14px;padding:0 16px;font-size:16px;background:var(--paper);color:#1B1714;margin-bottom:18px}
.linp:focus{outline:3px solid #D9C08F;border-color:var(--bronze)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.roles button{padding:16px 18px;border-radius:20px;cursor:pointer;text-align:left;background:var(--paper);color:#1B1714;border:1.5px solid var(--line);font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;line-height:1}
.roles button[aria-pressed="true"]{background:var(--ink);color:var(--gold);border-color:var(--gold)}
.accts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:22px}
.accts.adm{grid-template-columns:1fr 1fr}
.acct{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:20px;cursor:pointer;color:#1B1714;background:var(--paper);border:1.5px solid var(--line);font-weight:600;font-size:15px;min-width:0}
.accts.adm .acct{flex-direction:row;padding:12px 14px;border-radius:18px;text-align:left}
.acct svg{flex:none}
.acct span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:-4px 0 26px;font-size:14px;color:#5E554C;flex-wrap:wrap}
.lrow label{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:44px;color:#2E2621}
.lrow input{width:20px;height:20px;accent-color:var(--bronze)}
.go{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:56px;border-radius:999px;border:0;background:var(--gold);color:var(--ink);font-size:13px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;box-shadow:0 12px 28px rgba(201,169,110,.3)}
.go:disabled{background:#DDD3C3;color:#5E554C;box-shadow:none;cursor:not-allowed}
.lback{text-align:center;margin:28px 0 0;font-size:14px}
.lback a{color:var(--bronze)}

/* portal shell: sidebar + main */
.shell{display:flex;min-height:100vh;position:relative}
.side{flex:0 0 240px;width:240px;min-width:0;overflow:hidden;background:#1B1714;color:var(--cream);padding:22px 16px;border-right:1px solid rgba(201,169,110,.3);display:flex;flex-direction:column;gap:6px}
.sbrand{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 8px 4px;text-align:center;text-decoration:none;color:var(--cream)}
.sbrand img{height:92px;width:auto}
.sbrand .script{font-size:40px;line-height:.9}
.sbrand .oasis{font-size:20px;letter-spacing:.4em;padding-left:.4em;font-weight:400}
.srole{white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 0 18px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.srole::before,.srole::after{content:"";width:16px;height:1px;background:var(--gold)}
.nav{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 16px;border-radius:999px;color:var(--cream);background:none;border:0;font-weight:600;font-size:15px;cursor:pointer;text-align:left;width:100%;line-height:1.15}
.nav:hover{background:rgba(201,169,110,.12);color:var(--gold)}
.nav[aria-current="page"]{background:rgba(201,169,110,.16);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(201,169,110,.55)}
.nav i{width:10px;height:10px;border-radius:50%;flex:none}
.pmain{flex:1 1 auto;min-width:0;padding:28px;display:flex;flex-direction:column;gap:20px}
.kick .upd{color:var(--soft);font-weight:500;letter-spacing:.04em;text-transform:none;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
.kick{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);padding-right:70px}
.pmain>.hello{margin:-14px 0 0;padding-right:70px}
.topbar{display:none}
.pav{position:absolute;top:20px;right:28px;z-index:12}
.avbtn{display:block;padding:0;border:0;background:none;border-radius:50%;cursor:pointer;box-shadow:0 0 0 3px #1B1714,0 0 0 5px var(--c,#C9A96E)}
.avbtn svg{display:block}
.menu{position:absolute;right:0;top:58px;width:260px;background:#1B1714;color:var(--cream);border:1px solid var(--gold);border-radius:16px;padding:10px;box-shadow:0 18px 40px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:2px;z-index:40;max-height:calc(100vh - 90px);overflow-y:auto}
.menu .mh{padding:6px 12px 10px;margin-bottom:4px;border-bottom:1px solid rgba(201,169,110,.25)}
.menu .mh b{display:block;font-size:15px}
.menu .badge{display:inline-block;margin-top:6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#1B1714;padding:3px 10px;border-radius:999px}
.menu button,.menu a{display:flex;align-items:center;min-height:42px;padding:0 12px;border-radius:12px;color:var(--cream);background:none;border:0;text-decoration:none;font-size:14px;font-weight:500;cursor:pointer;text-align:left;width:100%}
.menu button:hover,.menu a:hover{background:rgba(201,169,110,.12)}
.menu button[aria-current="page"]{background:rgba(201,169,110,.16);color:var(--gold)}
.menu .out{color:#E6B8B8}
.menu .mk{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);padding:6px 12px 2px}
.menu .mpages{display:none;flex-direction:column;border-bottom:1px solid rgba(201,169,110,.25);padding-bottom:6px;margin-bottom:4px}

/* page heading */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:0}
.hello h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:46px;line-height:1.05;margin:4px 0 2px;color:var(--cream)}
.hello p{color:var(--soft);margin:0;font-size:15px}

/* cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--cream);color:#2E2621;border:1px solid #B8945A;border-radius:18px;padding:22px;box-shadow:0 18px 40px rgba(0,0,0,.35);min-width:0}
.stat .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.stat .k::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:7px;vertical-align:middle}
.stat:nth-child(1) .k{color:#8E3B46}.stat:nth-child(2) .k{color:#4F7A63}.stat:nth-child(3) .k{color:#6B4A6E}.stat:nth-child(4) .k{color:#6F7480}
.stat .v{font-size:18px;font-weight:700;margin-top:6px;overflow-wrap:anywhere}
.stat .s{font-size:14px;color:var(--muted);margin-top:2px}
.panel{background:var(--cream);color:#2E2621;border:1px solid #B8945A;border-radius:18px;padding:22px;box-shadow:0 18px 40px rgba(0,0,0,.35);min-width:0}
.ph,.h{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:28px;margin:0;line-height:1.15}
.ph::before,.h::before{content:"";display:inline-block;width:7px;height:7px;background:var(--gold);transform:rotate(45deg);margin-right:12px;vertical-align:middle;position:relative;top:-2px}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.cols>.panel:first-child{flex:999 1 560px}
.cols>.detail{flex:1 1 380px;border:1.5px solid #2E2621;display:flex;flex-direction:column;gap:16px}
.k2{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tscroll{overflow-x:auto}
.tscroll td,.tscroll th{white-space:nowrap}
.tscroll th{letter-spacing:.06em;font-size:12px;font-weight:600}
.tscroll td,.tscroll th{padding-left:8px;padding-right:8px}
.accts.adm .acct span{white-space:normal;line-height:1.2}
tr.sel td{background:#F1E8D8}
.bpill{font-weight:700;padding:4px 10px;border-radius:999px;font-size:13px;background:#F0E3C6;color:#6B4E00}
.bpill.ok{background:#E8DCC4;color:#2F5A47}
.obtn{min-height:36px;padding:0 16px;border-radius:999px;background:var(--paper);border:1.5px solid #2E2621;color:#2E2621;font-weight:700;font-size:14px;cursor:pointer}
.box{border:1px solid var(--line);border-radius:14px;padding:16px}
.box h3{font-size:16px;font-weight:700;margin:0 0 10px;color:#2E2621}
.dkv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dkv div{background:#EDE3D1;border-radius:12px;padding:12px;font-weight:700;font-size:14px}
.dkv small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.dep{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#E6DCCB;color:#3A322B}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.catgrid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;color:var(--text);font-size:12.5px;font-weight:600}
.catgrid button[aria-pressed="true"]{border:2px solid var(--bronze);background:#EDE3D1}
.bigcat{display:block;width:100%;height:100%}
.bigcat svg{width:100%;height:100%;display:block}
.linkbtn{background:none;border:0;padding:0;font-weight:700;font-size:14px;color:var(--bronze);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.dl{display:flex;justify-content:space-between;gap:8px}
.dl span{color:var(--muted)}
.dl b{text-align:right}
.extn{min-width:64px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid #D3C4AA;border-radius:999px;background:var(--paper);font-weight:700;font-size:20px}
.stepper .round{width:46px;height:46px;font-size:22px;border:1.5px solid #D3C4AA}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.tab .n{opacity:.7;margin-left:4px}
.search{min-height:40px;max-width:260px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.rowb{cursor:pointer}
tr.rowb:hover td{background:#F7F0E3}
td.num,th.num{text-align:right;white-space:nowrap}
.ref{font-weight:600;white-space:nowrap}
.st{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.st.Pending{background:#FFF1CC;color:#7A5200}
.st.Confirmed{background:#DDEBE3;color:var(--ok)}
.st.Checked-in{background:#12100E;color:var(--gold)}
.st.Completed{background:#E6DCCB;color:var(--muted)}
.st.Cancelled,.st.No-show{background:#F6E3DF;color:var(--bad)}
.bal{color:var(--bad);font-weight:600}
.paid{color:var(--ok)}
.cards{display:none}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}

/* drawer */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--cream);color:var(--text);z-index:21;overflow:auto;box-shadow:-20px 0 50px rgba(0,0,0,.4)}
.dh{position:sticky;top:0;background:var(--ink);color:var(--cream);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:2}
.dh .t{font-family:'Cormorant Garamond',serif;font-size:26px;line-height:1}
.dh button{background:none;border:1px solid rgba(243,236,224,.4);color:var(--cream);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:18px}
.sec{padding:16px 20px;border-bottom:1px solid var(--line)}
.sec h3{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 10px}
.big{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;line-height:1.1}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:#F1E8DA;border-radius:12px;padding:8px 12px}
.kv small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row.tot{font-weight:600;font-size:15px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.glist .g{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.glist .g:last-child{border-bottom:0}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:inline-flex;align-items:center;gap:12px}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--text);cursor:pointer;font-size:18px}
.round:disabled{opacity:.35;cursor:default}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.hint.warn{color:var(--warn)}
.ticks label{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px;cursor:pointer}
.ticks input{width:20px;height:20px;accent-color:var(--ok)}
.viewer{position:fixed;inset:0;background:#0E0C0B;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.viewer img{max-width:100%;max-height:80vh;border-radius:10px}
.viewer iframe{width:min(820px,100%);height:80vh;border:0;background:#fff;border-radius:10px}
.viewer p{margin:0;color:var(--cream)}

/* calendar */
.calbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.calbar h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:30px;margin:0;min-width:200px;text-align:center}
.calnav{display:flex;align-items:center;gap:8px}
.counts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.counts i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px}
.gkey{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px}
.gkey button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 10px;font-size:13px;color:var(--text);cursor:pointer;text-align:left}
.gkey .dot{width:12px;height:12px;border-radius:50%;flex:none}
.gkey small{display:block;color:var(--muted);font-size:11.5px}
.cdow,.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cdow div{text-align:center;font-size:11px;letter-spacing:.16em;color:var(--muted);padding:2px 0 4px}
.cday{min-height:92px;border-radius:12px;padding:7px;display:flex;flex-direction:column;gap:3px;background:var(--paper);border:1.5px solid #E6DCCB;min-width:0}
.cday.busy{border-color:#D3C4AA}
.cday.today{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold) inset}
.cday.past{opacity:.6}
.cday.blank{visibility:hidden}
.cday .top1{display:flex;justify-content:space-between;gap:4px}
.cday .top1 b{font-size:13px}
.cday .top1 span{font-size:10px;color:var(--muted)}
.chip2{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;color:#fff;border:0;cursor:pointer;text-align:left}
.more{font-size:10px;color:var(--muted)}
.strip{position:relative;display:block;height:6px;border-radius:3px;margin-top:auto;background:#E6DCCB;overflow:hidden}
.strip span{position:absolute;top:0;bottom:0;border-radius:3px}
.strip span.clean{background:repeating-linear-gradient(45deg,#B9AE9F 0 3px,transparent 3px 6px);border-radius:0}

/* sign-in tiles: everyone shown */
.acct span{white-space:normal;text-align:center;line-height:1.2;overflow-wrap:anywhere}
.acct small{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#7A6A55;margin-top:-4px}
.acct.dim{opacity:.5}

/* checklist & upkeep (design) */
.ckhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.cksub{font-size:14px;color:var(--muted);margin-top:4px}
.cksel{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.cksel select{background:var(--paper);border-color:#D3C4AA;max-width:100%}
.ckprog{min-width:220px}
.ckprog>div:first-child{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:700}
.ckbar{height:10px;background:#E6DCCB;border-radius:999px;margin-top:6px;overflow:hidden}
.ckbar i{display:block;height:100%;background:#4F7A63;border-radius:999px;transition:width .25s}
.rtabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.rtab,.ubtn{min-height:44px;padding:0 18px;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:.04em;cursor:pointer;background:var(--paper);color:#2E2621;border:1.5px solid #D3C4AA}
.rtab[aria-pressed="true"]{background:#2E2621;color:#fff;border-color:#2E2621}
.ckrow2{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #E6DCCB}
.ckname2{flex:1 1 220px;min-width:0}
.ckname2 b{display:block}
.ckname2 span{font-size:13px;color:var(--muted)}
.ckbtns{display:flex;gap:6px}
.ckbtns button{min-height:40px;padding:0 16px;border-radius:999px;background:var(--paper);color:#3A322B;border:1.5px solid #D3C4AA;font-weight:700;font-size:14px;letter-spacing:.04em;cursor:pointer}
.cknote2{flex:1 1 100%;background:var(--paper);border-color:#D3C4AA}
.additem{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.additem #ai{flex:2 1 200px}
.additem #aq{flex:1 1 120px}
.ckfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.ubtn.dashed{border:1.5px dashed #4F7A63;color:#4F7A63}
.ubtn.dark{background:#2E2621;color:#fff;border-color:#2E2621}
.ubtn.green{background:#4F7A63;color:#fff;border-color:#4F7A63}
.ubtn:disabled{opacity:.5;cursor:not-allowed}
.uhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.ulegend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;margin-bottom:12px}
.ulegend span{display:flex;align-items:center;gap:6px}
.ulegend i{width:14px;height:14px;border-radius:4px}
.udow,.ugrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.udow{text-align:center;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.ucell{min-height:84px;border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;cursor:pointer;color:#2E2621;background:#fff;border:1px solid #E2D6C2;min-width:0}
.ucell.blank{border:0;background:transparent;cursor:default}
.ucell.on{background:#F0E3C6;border:2px solid #1B1714}
.ucell b{font-size:13px}
.ucell span{display:flex;flex-wrap:wrap;gap:3px}
.ucell i,.uentry i{font-style:normal;display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px}
.xbtn{background:none;border:1px solid var(--line);border-radius:50%;width:28px;height:28px;cursor:pointer;color:var(--muted);flex:none;padding:0;font-size:12px}
.ulog{display:flex;flex-direction:column;gap:14px}
.uentry{border:1px solid #E2D6C2;border-radius:12px;padding:12px}
.ue1{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.ue2{font-size:14px;margin-top:8px}
.ue3{font-size:12px;color:var(--muted);margin-top:4px}
.uform{border-top:1px solid #E2D6C2;padding-top:14px;display:flex;flex-direction:column;gap:8px}
.uform .inp{background:var(--paper);border-color:#D3C4AA}
@media (max-width: 760px){
  .ckprog{min-width:0;width:100%}
  .cksub{font-size:13px}
  .rtabs{gap:6px;margin:12px 0}
  .rtab{min-height:36px;padding:0 12px;font-size:12px}
  .ckrow2{gap:6px}
  .ckbtns{flex:1 1 100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  .ckbtns button{min-height:34px;padding:0 2px;font-size:11px;letter-spacing:0}
  .ubtn{min-height:40px;padding:0 14px;font-size:12.5px}
  .udow,.ugrid{gap:3px}
  .udow{font-size:10px}
  .ucell{min-height:46px;padding:4px;border-radius:8px;gap:3px}
  .ucell b{font-size:11.5px;line-height:1.1}
  .ucell i{font-size:0;width:7px;height:7px;padding:0;border-radius:50%}
}

/* announcements (design) */
.anwrap{max-width:820px;display:flex;flex-direction:column;gap:18px}
.anav{display:inline-block;border-radius:50%;flex:none;overflow:hidden;line-height:0}
.anav svg{width:100%;height:100%}
.ancompose{display:flex;flex-direction:column;gap:10px}
.ancompose textarea{min-height:80px;padding:12px 14px;resize:vertical;line-height:1.5}
.ancompose .inp{background:var(--paper);border-color:#D3C4AA}
.anhead{display:flex;align-items:center;gap:12px}
.anrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.anpin{display:flex;align-items:center;gap:10px;font-weight:600;min-height:44px;cursor:pointer}
.anpin input{width:20px;height:20px;accent-color:#4F7A63}
.ansort{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.sortb{min-height:44px;padding:0 18px;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:.04em;cursor:pointer;background:var(--paper);color:#2E2621;border:1.5px solid #D3C4AA}
.sortb[aria-pressed="true"]{background:#2E2621;color:#fff;border-color:#2E2621}
.anpost{position:relative}
.anpost.pinned{border-color:#C9A96E;box-shadow:0 0 0 1px #C9A96E,0 18px 40px rgba(0,0,0,.35)}
.pintag{position:absolute;top:0;right:22px;background:#C9A96E;color:#12100E;font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;padding:6px 10px 8px;border-radius:0 0 8px 8px}
.anname{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:15px}
.anrole{font-weight:700;padding:2px 8px;border-radius:6px;background:#E9DFCC;color:#2F5A47;font-size:13px}
.anrole.dark{background:#2E2621;color:#fff}
.antime{font-size:12px;color:var(--muted);margin-top:2px}
.pdel{margin-left:auto;width:36px;height:36px;flex:none;border-radius:50%;border:1.5px solid #E2C9C0;background:var(--paper);color:#9A3B2E;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.anpost.pinned .pdel{margin-top:22px}
.antitle{font-family:'Cormorant Garamond',serif;font-size:26px;line-height:1.15;margin:16px 0 6px;font-weight:600}
.anbody{margin:0;line-height:1.7;color:#3A322B;white-space:pre-line;font-size:15px;overflow-wrap:anywhere}
.anfoot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid #E6DCCB}
.vote{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 12px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;background:var(--paper);color:#2E2621;border:1.5px solid #D3C4AA}
.vote.up{background:#2E2621;color:#EFE6D6;border-color:#2E2621}
.vote.down{background:#ECE3D6;color:#2E2621;border-color:#7A5A2E}
.cbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;margin-left:auto;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;background:var(--paper);color:#2E2621;border:1.5px solid #D3C4AA}
.cbtn.on{background:#1B1714;color:#C9A96E;border-color:#1B1714}
.cbox{margin-top:14px;background:#EFE6D6;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.nocmt{font-size:13px;color:var(--muted);text-align:center;padding:4px 0}
.cmt{display:flex;align-items:flex-end;gap:8px}
.cmt.mine{flex-direction:row-reverse}
.bub{max-width:78%;padding:9px 13px;border-radius:16px;background:var(--paper);color:#2E2621;border:1px solid #E2D6C2;border-bottom-left-radius:4px;min-width:0}
.cmt.mine .bub{background:#1B1714;color:#F3ECE0;border-color:#1B1714;border-bottom-left-radius:16px;border-bottom-right-radius:4px}
.bh{display:flex;align-items:baseline;gap:8px;font-size:12px;margin-bottom:3px}
.bh b{font-size:13px}
.bh span{color:var(--muted)}
.cmt.mine .bh span{color:#C9A96E}
.cdel{margin-left:auto;width:24px;height:24px;flex:none;border-radius:50%;border:0;padding:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;opacity:.75;color:#9A3B2E}
.cmt.mine .cdel{color:#E6B8B8}
.bt{font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.cin{display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid #D3C4AA;border-radius:999px;padding:4px}
.cin input{flex:1;min-width:0;border:0;background:transparent;font-size:14px;color:#2E2621;outline:none;min-height:38px}
.send{width:40px;height:40px;flex:none;border-radius:50%;border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#E6DCCB;color:#8A7E6E}
.send.ready{background:#C9A96E;color:#12100E}
@media (max-width: 760px){
  .antitle{font-size:21px;margin:12px 0 4px}
  .anbody{font-size:14px;line-height:1.6}
  .vote,.cbtn,.sortb{min-height:38px;font-size:13px;padding:0 12px}
  .bub{max-width:85%}
  .anpost.pinned .anhead{padding-top:20px}
  .anpost.pinned .pdel{margin-top:0}
}

/* overview (design) */
.stats.big5 .stat:nth-child(5) .k{color:#7A5A2E}
.stats.big5 .v{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;line-height:1.1}
.ovhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.ubtn.sm{min-height:38px;padding:0 14px;font-size:13px}
.ovbtns{display:flex;gap:6px;white-space:nowrap}
.ovst{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#E8DCC4;color:#2F5A47}
.ovst.off{background:#F6E3DF;color:var(--bad)}
.ovst.past{background:#E6DCCB;color:var(--muted)}
.ovform{background:#EDE3D1;border-radius:18px;padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ovgrid4{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.ovgrid4 .wide{grid-column:1 / -1}
.ovform label{display:flex;flex-direction:column;gap:6px;min-width:0}
.ovform .inp{background:var(--paper);border-color:#D3C4AA}
.ovform textarea.inp{padding:10px 14px;min-height:64px;resize:vertical}
.ovfixed{display:flex;align-items:center;color:var(--muted);background:#F3ECE0 !important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovrevs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px}
.ovrev{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ovrev p{margin:0;line-height:1.55;font-size:14px;overflow-wrap:anywhere}
.ovr1{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.stars{color:#1B1714;letter-spacing:2px;font-size:15px}
.ovreply{background:#F1E8D8;border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5}
.ovreply small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ovreplyform{display:flex;gap:8px}
.ovreplyform .inp{min-height:40px;background:var(--paper)}
.actrow{display:flex;gap:12px;padding:10px 0;border-top:1px solid #E6DCCB;font-size:14px}
.actrow>span:first-child{color:var(--muted);min-width:130px;flex:none}
.ovm{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
@media (max-width: 760px){
  .stats.big5 .v{font-size:22px}
  .stats.big5 .stat:nth-child(5){grid-column:1 / -1}
  .ovgrid4{grid-template-columns:1fr 1fr}
  .ovgrid4 label:first-child{grid-column:1 / -1}
  .actrow{flex-direction:column;gap:2px;font-size:13px}
  .actrow>span:first-child{font-size:11.5px;min-width:0}
  .ovreplyform{flex-direction:column}
}

/* records */
.sel{min-height:36px;width:auto;padding:0 10px;font-size:14px}
.xl{font-size:12px;color:var(--muted);align-self:center}
.ph{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:26px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:6px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi small{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.big2{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.kpi.big2 small{color:var(--gold)}
.kpi.big2 span{color:var(--soft)}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;align-items:end;height:200px;margin-top:10px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;background:none;border:0;cursor:pointer;padding:0;color:var(--text)}
.bar .bb{width:100%;max-width:46px;border-radius:10px 10px 4px 4px}
.bar .bv{font-size:11px;color:var(--muted)}
.bar .bl{font-size:12px}
.bar[aria-current="true"] .bl{font-weight:700;color:var(--bronze)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.meth{margin-bottom:8px}
.mbar{height:8px;border-radius:999px;background:#E6DCCB;overflow:hidden}
.mbar span{display:block;height:100%;border-radius:999px;background:#4F7A63}
select.inp{appearance:auto}

@media (max-width: 1100px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width: 820px){
  .panel table:has(+ .cards){display:none}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi b{font-size:22px}
  .twocol{grid-template-columns:1fr}
  .bars{gap:3px;height:200px}
  .bar .bv{font-size:8px}
  .bar .bl{font-size:10px}
  .ph{font-size:22px}
  .calbar h2{font-size:24px;min-width:0}
  .cdow,.cgrid{gap:3px}
  .cdow div{font-size:9px;letter-spacing:.06em}
  .cday{min-height:62px;padding:4px;border-radius:8px}
  .cday .top1 span{display:none}
  .chip2{font-size:9px;padding:0 3px;border-radius:3px}
  .gkey button{flex:1 1 100%}
  .panel{padding:14px;border-radius:18px}
  .search{max-width:none;width:100%}
  .cards{display:block}
  .card{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:12px 14px;margin-top:8px;cursor:pointer;width:100%;text-align:left;color:var(--text)}
